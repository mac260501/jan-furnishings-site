[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Jan Interiors sub-site routing
# Ensures /interiors (no trailing slash) redirects cleanly to /interiors/
[[redirects]]
  from = "/interiors"
  to = "/interiors/"
  status = 301

# IndexNow key file must be served as plain text
[[headers]]
  for = "/2f27756be4974a51948c2aa285fb06d1.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
